[project]
name = "git-agent"
version = "0.1.0"
description = "CLI assistant to push a local project to GitHub"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
git-agent = "git_agent.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["git_agent*"]
